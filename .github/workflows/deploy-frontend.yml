name: Deploy frontend (boletos-novo)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-boletos-novo-front
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Localizar build
        id: out
        run: |
          INDEX=$(find dist -type f -name index.html | head -n 1)
          test -n "$INDEX"
          echo "dir=$(dirname "$INDEX")" >> "$GITHUB_OUTPUT"

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          : "${SSH_KEY:?secret VPS_SSH_KEY está vazio}"
          : "${SSH_HOST:?secret VPS_HOST está vazio}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "Chave privada inválida ou protegida por senha"; exit 1; }
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Debug fingerprint
        run: ssh-keygen -lf ~/.ssh/deploy_key

      - name: Enviar e publicar
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          BUILD_DIR: ${{ steps.out.outputs.dir }}
        run: |
          HOST="$SSH_USER@$SSH_HOST"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"

          tar -czf - -C "$BUILD_DIR" . | ssh $SSH_OPTS "$HOST" '
            set -e
            rm -rf /var/www/boletos-novo/.incoming
            mkdir -p /var/www/boletos-novo/.incoming
            tar -xzf - -C /var/www/boletos-novo/.incoming
          '

          ssh $SSH_OPTS "$HOST" '
            set -e
            cd /var/www/boletos-novo
            test -f .incoming/index.html
            find . -mindepth 1 -maxdepth 1 ! -name .incoming -exec rm -rf {} +
            cp -a .incoming/. .
            rm -rf .incoming
          '
