<main class="login-page">
  <section class="login-panel" aria-labelledby="reset-title">
    <a class="brand" routerLink="/login" aria-label="Voltar ao login">
      <span>boleto<span class="brand-accent">.fácil</span></span>
    </a>

    <div class="login-content">
      <div class="eyebrow"><span class="eyebrow-dot"></span> NOVA SENHA</div>
      <h1 id="reset-title">Crie uma<br />nova senha<span>.</span></h1>

      <ng-container *ngIf="!done(); else concluido">
        <p class="login-description">Escolha uma senha com no mínimo 8 caracteres.</p>

        <form *ngIf="token" (ngSubmit)="onSubmit()" #resetForm="ngForm" novalidate>
          <div class="form-field">
            <label for="newPassword">Nova senha</label>
            <div class="input-wrap">
              <input
                id="newPassword"
                name="newPassword"
                [type]="showPassword() ? 'text' : 'password'"
                [(ngModel)]="newPassword"
                placeholder="Digite a nova senha"
                autocomplete="new-password"
                minlength="8"
                maxlength="72"
                required
              />
              <button
                class="password-toggle"
                type="button"
                (click)="showPassword.set(!showPassword())"
                [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
              >
                {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
              </button>
            </div>
          </div>

          <div class="form-field">
            <label for="confirmPassword">Confirmar nova senha</label>
            <div class="input-wrap">
              <input
                id="confirmPassword"
                name="confirmPassword"
                [type]="showPassword() ? 'text' : 'password'"
                [(ngModel)]="confirmPassword"
                placeholder="Repita a nova senha"
                autocomplete="new-password"
                required
              />
            </div>
          </div>

          <div *ngIf="error()" class="login-error" role="alert">
            <span>{{ error() }}</span>
          </div>

          <button class="submit-button" type="submit" [disabled]="!resetForm.valid || isSubmitting()">
            <span>{{ isSubmitting() ? 'Salvando...' : 'Redefinir senha' }}</span>
          </button>
        </form>

        <div *ngIf="!token && error()" class="login-error" role="alert">
          <span>{{ error() }}</span>
        </div>

        <p *ngIf="!token" class="login-description">
          <a routerLink="/esqueci-senha">Solicitar novo link</a>
        </p>
      </ng-container>

      <ng-template #concluido>
        <p class="login-description" role="status">Senha redefinida com sucesso. Agora você já pode entrar.</p>
        <p class="login-description"><a routerLink="/login">Ir para o login</a></p>
      </ng-template>
    </div>
  </section>
</main>
